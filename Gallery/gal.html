<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <!-- <link rel="stylesheet" href="./reset.css"> -->
    <link rel="stylesheet" href="./style.css">
    <script src="./gal.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Gallery</h1>
      <a href="./fav/favorites.html">My Favorites</a>
      <input type="text" name="search input" placeholder="search content... " id="search-input"> 
      <div id="filters">
        <label>
          <input type="checkbox" value="all" class="gen-filter" checked> All
        </label>
        <label>
          <input type="checkbox" value="1" class="gen-filter"> Gen 1
        </label>
        <label>
          <input type="checkbox" value="2" class="gen-filter"> Gen 2
        </label>
        <label>
          <input type="checkbox" value="3" class="gen-filter"> Gen 3
        </label>
        <label>
          <input type="checkbox" value="4" class="gen-filter"> Gen 4
        </label>
        <label>
          <input type="checkbox" value="5" class="gen-filter"> Gen 5
        </label>
      </div>
      <div id="content"></div>
    </main>

    <dialog id="modal">
      <div class="modal-content">
        <button class="fav-btn">🩶</button>
        <img id="modal-img" src="" alt="">
        <p id="modal-caption"></p>
        <button id="close-modal">Close</button>
      </div>
    </dialog>

  </body>
</html>
